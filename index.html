<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerExchange 2026 — Team Meeting Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0c1f3f; --navy-mid:#162d56; --gold:#e8b84b; --gold-light:#f5d07a;
  --white:#fff; --slate:#6b7a99; --border:rgba(255,255,255,0.09);
  --card-bg:rgba(255,255,255,0.04); --success:#4caf84; --danger:#e05c5c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 70% 50% at 15% 0%,rgba(232,184,75,.07) 0%,transparent 60%),
  radial-gradient(ellipse 60% 60% at 85% 100%,rgba(30,58,110,.7) 0%,transparent 70%),
  repeating-linear-gradient(0deg,transparent,transparent 48px,rgba(255,255,255,.012) 48px,rgba(255,255,255,.012) 49px),
  repeating-linear-gradient(90deg,transparent,transparent 48px,rgba(255,255,255,.012) 48px,rgba(255,255,255,.012) 49px);
  pointer-events:none;z-index:0;}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;}

/* HEADER */
header{padding:18px 36px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;backdrop-filter:blur(12px);background:rgba(12,31,63,.75);position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.logo-area h1{font-family:'DM Serif Display',serif;font-size:1.4rem;}
.logo-area h1 span{color:var(--gold);}
.logo-area p{font-size:.7rem;color:var(--slate);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.date-badge{background:rgba(232,184,75,.12);border:1px solid rgba(232,184,75,.3);color:var(--gold-light);padding:7px 15px;border-radius:100px;font-size:.75rem;font-weight:600;letter-spacing:.04em;}
.sync-status{display:flex;align-items:center;gap:7px;font-size:.73rem;font-weight:600;padding:6px 13px;border-radius:100px;border:1px solid;transition:all .3s;}
.sync-status.ok{color:var(--success);border-color:rgba(76,175,132,.3);background:rgba(76,175,132,.08);}
.sync-status.err{color:var(--danger);border-color:rgba(224,92,92,.3);background:rgba(224,92,92,.08);}
.sync-status.loading{color:var(--gold);border-color:rgba(232,184,75,.3);background:rgba(232,184,75,.08);}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sync-status.ok .sync-dot{background:var(--success);}
.sync-status.err .sync-dot{background:var(--danger);}
.sync-status.loading .sync-dot{background:var(--gold);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* CONFIG BANNER */
.config-banner{background:rgba(232,184,75,.1);border-bottom:1px solid rgba(232,184,75,.25);padding:14px 36px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.config-banner p{font-size:.82rem;color:var(--gold-light);flex:1;}
.config-banner p strong{color:var(--gold);}
.config-banner input{background:rgba(255,255,255,.08);border:1px solid rgba(232,184,75,.4);color:var(--white);padding:8px 14px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.82rem;outline:none;width:380px;max-width:100%;}
.config-banner input:focus{border-color:var(--gold);}
.config-banner input::placeholder{color:rgba(255,255,255,.3);}
.btn-connect{background:var(--gold);color:var(--navy);border:none;padding:9px 20px;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;white-space:nowrap;transition:background .15s;}
.btn-connect:hover{background:var(--gold-light);}

/* TABS */
.tab-bar{display:flex;gap:4px;padding:14px 36px 0;border-bottom:1px solid var(--border);background:rgba(12,31,63,.4);overflow-x:auto;}
.tab-btn{background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;color:var(--slate);padding:10px 18px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;letter-spacing:.02em;white-space:nowrap;}
.tab-btn:hover{color:rgba(255,255,255,.7);}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
.content{flex:1;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* FORM */
#tab-add{padding:40px 24px;display:flex;justify-content:center;}
.add-form-wrap{width:100%;max-width:640px;background:var(--card-bg);border:1px solid var(--border);border-radius:18px;padding:36px;}
.add-form-wrap h2{font-family:'DM Serif Display',serif;font-size:1.3rem;margin-bottom:28px;display:flex;align-items:center;gap:10px;}
.add-form-wrap h2 .ico{width:34px;height:34px;border-radius:9px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--navy);flex-shrink:0;}
.form-group{margin-bottom:18px;}
label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);margin-bottom:7px;}
label .req{color:var(--gold);}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);color:var(--white);padding:11px 14px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.875rem;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:rgba(232,184,75,.05);}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.22);}
select option{background:#1a2e50;}
textarea{resize:vertical;min-height:70px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tags-wrap{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:10px;padding:8px;min-height:78px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;cursor:text;transition:border-color .2s;}
.tags-wrap:focus-within{border-color:var(--gold);background:rgba(232,184,75,.05);}
.tag{background:rgba(232,184,75,.18);border:1px solid rgba(232,184,75,.35);color:var(--gold-light);padding:4px 10px;border-radius:100px;font-size:.75rem;font-weight:500;display:flex;align-items:center;gap:5px;animation:popIn .15s ease;}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.tag-rm{background:none;border:none;color:rgba(232,184,75,.6);cursor:pointer;font-size:1rem;line-height:1;padding:0;transition:color .15s;}
.tag-rm:hover{color:var(--danger);}
.tag-inp{background:none;border:none;color:var(--white);font-family:'DM Sans',sans-serif;font-size:.875rem;outline:none;flex:1;min-width:130px;padding:4px 6px;}
.hint{font-size:.68rem;color:rgba(255,255,255,.28);margin-top:5px;}
.btn-submit{width:100%;background:var(--gold);color:var(--navy);border:none;padding:13px;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;margin-top:10px;transition:background .2s,transform .1s;}
.btn-submit:hover{background:var(--gold-light);}
.btn-submit:active{transform:scale(.98);}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;}

/* SCHEDULE + TEAM panels */
#tab-schedule,#tab-team{padding:28px 36px;}
.stats-bar{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.stat-chip{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px 20px;min-width:100px;}
.stat-chip .num{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--gold);display:block;}
.stat-chip .lbl{font-size:.65rem;color:var(--slate);letter-spacing:.07em;text-transform:uppercase;}
.filter-bar{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;align-items:center;}
.filter-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:var(--slate);padding:6px 14px;border-radius:100px;font-size:.73rem;font-weight:600;cursor:pointer;transition:all .15s;}
.filter-btn.active,.filter-btn:hover{background:rgba(232,184,75,.14);border-color:rgba(232,184,75,.35);color:var(--gold-light);}
.search-inp{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:var(--white);padding:7px 14px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.8rem;outline:none;width:190px;transition:all .2s;margin-left:auto;}
.search-inp:focus{border-color:var(--gold);}
.search-inp::placeholder{color:rgba(255,255,255,.22);}
.btn-refresh,.btn-print{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--slate);padding:6px 14px;border-radius:100px;font-size:.73rem;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;}
.btn-refresh:hover,.btn-print:hover{color:var(--white);border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.1);}
.btn-refresh.spinning .ri{display:inline-block;animation:spin .8s linear infinite;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* CARDS */
.day-section{margin-bottom:32px;}
.day-header{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--border);}
.day-header .day-name{font-family:'DM Serif Display',serif;font-size:1.15rem;}
.day-header .day-date{color:var(--slate);font-size:.85rem;}
.day-header .day-count{margin-left:auto;background:rgba(255,255,255,.07);padding:3px 12px;border-radius:100px;font-size:.7rem;font-weight:700;color:var(--slate);}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px;}
.meeting-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:17px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s;animation:cardIn .22s ease;cursor:pointer;}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.meeting-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:14px 0 0 14px;}
.meeting-card:hover{border-color:rgba(232,184,75,.28);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.25);}
.t-lunch::before{background:#4caf84;} .t-dinner::before{background:#e8a24b;} .t-meeting::before{background:#5b8dee;}
.t-reception::before{background:#c45be8;} .t-breakfast::before{background:#e8d44b;} .t-other::before{background:var(--slate);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;}
.type-pill{font-size:.63rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:100px;}
.t-lunch .type-pill{background:rgba(76,175,132,.15);color:#4caf84;} .t-dinner .type-pill{background:rgba(232,162,75,.15);color:#e8a24b;}
.t-meeting .type-pill{background:rgba(91,141,238,.15);color:#5b8dee;} .t-reception .type-pill{background:rgba(196,91,232,.15);color:#c45be8;}
.t-breakfast .type-pill{background:rgba(232,212,75,.15);color:#e8d44b;} .t-other .type-pill{background:rgba(107,122,153,.15);color:var(--slate);}
.time-tag{font-size:.75rem;font-weight:600;color:rgba(255,255,255,.55);white-space:nowrap;}
.card-coop{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--white);line-height:1.25;margin-bottom:10px;}
.card-meta{display:flex;flex-direction:column;gap:5px;}
.card-meta-row{display:flex;align-items:center;gap:7px;font-size:.76rem;color:var(--slate);}
.card-meta-row strong{color:rgba(255,255,255,.75);}
.card-attendees{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.att-chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.6);padding:2px 8px;border-radius:100px;font-size:.68rem;}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:10px;border-top:1px solid var(--border);}
.seats-badge{display:flex;align-items:center;gap:4px;background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.22);color:var(--gold);padding:3px 9px;border-radius:100px;font-size:.7rem;font-weight:700;}
.btn-del{background:none;border:none;color:rgba(255,255,255,.2);cursor:pointer;font-size:.85rem;padding:4px 6px;border-radius:6px;transition:all .15s;margin-left:4px;}
.btn-del:hover{color:var(--danger);background:rgba(224,92,92,.1);}
.sp-avatar{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.6rem;color:var(--navy);vertical-align:middle;margin-right:5px;flex-shrink:0;}
.sp-color-0{background:#e87a4b;} .sp-color-1{background:#4b9be8;} .sp-color-2{background:#4bcf7a;}
.sp-color-3{background:#e8d44b;} .sp-color-4{background:#c45be8;} .sp-color-5{background:#e84b7a;} .sp-color-6{background:#4be8c4;}

/* TEAM VIEW */
.person-section{margin-bottom:20px;}
.person-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--border);transition:border-color .15s;}
.person-header:hover{border-color:rgba(232,184,75,.25);}
.person-avatar-lg{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:var(--navy);flex-shrink:0;}
.person-info{flex:1;}
.person-info .pname{font-weight:700;font-size:.95rem;}
.person-info .pcounts{font-size:.72rem;color:var(--slate);margin-top:2px;}
.person-expand{color:var(--slate);font-size:.75rem;transition:transform .2s;}
.person-header.expanded .person-expand{transform:rotate(180deg);}
.person-cards{display:none;padding:14px 4px 4px;}
.person-cards.open{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:8px;}

/* CALENDAR */
#tab-calendar{padding:28px 36px;}
.cal-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.cal-title{font-family:'DM Serif Display',serif;font-size:1.15rem;flex:1;}
.cal-legend{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.cal-legend-item{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--slate);}
.cal-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.cal-grid{display:grid;grid-template-columns:64px repeat(5,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.cal-hdr{background:rgba(255,255,255,.06);padding:12px 8px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
.cal-hdr:last-child{border-right:none;}
.cal-hdr .ch-day{font-family:'DM Serif Display',serif;font-size:1rem;}
.cal-hdr .ch-date{font-size:.65rem;color:var(--slate);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
.cal-time-col{border-right:1px solid var(--border);}
.cal-time-slot{height:56px;display:flex;align-items:flex-start;justify-content:flex-end;padding:4px 6px 0 0;font-size:.6rem;color:var(--slate);font-weight:600;border-bottom:1px solid rgba(255,255,255,.04);}
.cal-day-col{border-right:1px solid var(--border);position:relative;}
.cal-day-col:last-child{border-right:none;}
.cal-hour-line{height:56px;border-bottom:1px solid rgba(255,255,255,.04);}
.cal-event{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 6px;font-size:.68rem;font-weight:600;cursor:pointer;overflow:hidden;z-index:2;transition:filter .15s,transform .1s;border-left:3px solid rgba(0,0,0,.2);}
.cal-event:hover{filter:brightness(1.15);transform:scale(1.02);}
.cal-event .ce-time{font-size:.58rem;opacity:.85;margin-bottom:1px;}
.cal-event .ce-coop{font-weight:700;line-height:1.2;}
.cal-event .ce-sp{font-size:.58rem;opacity:.75;margin-top:2px;}
.ce-lunch{background:rgba(76,175,132,.85);color:#fff;} .ce-dinner{background:rgba(232,162,75,.9);color:#fff;}
.ce-meeting{background:rgba(91,141,238,.85);color:#fff;} .ce-reception{background:rgba(196,91,232,.85);color:#fff;}
.ce-breakfast{background:rgba(220,200,60,.85);color:#111;} .ce-other{background:rgba(107,122,153,.85);color:#fff;}

/* EMPTY + MODAL */
.empty-state{text-align:center;padding:60px 20px;color:var(--slate);}
.empty-state .ei{font-size:2.8rem;margin-bottom:12px;opacity:.35;}
.empty-state p{font-size:.88rem;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,18,38,.88);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#152540;border:1px solid rgba(232,184,75,.25);border-radius:18px;padding:32px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:modalIn .2s ease;}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-family:'DM Serif Display',serif;font-size:1.2rem;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;}
.btn-close{background:none;border:none;color:var(--slate);font-size:1.4rem;cursor:pointer;line-height:1;}
.btn-close:hover{color:var(--white);}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-cancel{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--white);padding:12px;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;}
.btn-cancel:hover{background:rgba(255,255,255,.12);}
.btn-save{flex:1;background:var(--gold);color:var(--navy);border:none;padding:12px;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:700;cursor:pointer;}
.btn-save:hover{background:var(--gold-light);}
.btn-save:disabled{opacity:.6;cursor:not-allowed;}
.toast{position:fixed;bottom:28px;right:28px;padding:12px 22px;border-radius:10px;font-weight:600;font-size:.85rem;z-index:999;animation:toastIn .2s ease;box-shadow:0 8px 30px rgba(0,0,0,.4);}
.toast.ok{background:var(--success);color:var(--white);} .toast.err{background:var(--danger);color:var(--white);}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

@media(max-width:700px){
  .form-row{grid-template-columns:1fr;}
  #tab-schedule,#tab-team,#tab-calendar{padding:20px;}
  #tab-add{padding:20px;}
  .add-form-wrap{padding:22px;}
  header{padding:16px 20px;}
  .tab-bar{padding:12px 20px 0;}
  .cal-grid{grid-template-columns:44px repeat(5,1fr);}
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="logo-area">
    <h1>Power<span>Exchange</span> &middot; Team Planner</h1>
    <p>NRECA TechAdvantage 2026 &middot; Orlando, FL</p>
  </div>
  <div class="header-right">
    <div class="date-badge">&#128197; March 7&ndash;11, 2026</div>
    <div class="sync-status loading" id="syncStatus">
      <div class="sync-dot"></div><span id="syncText">Not connected</span>
    </div>
  </div>
</header>

<div class="config-banner" id="configBanner">
  <p><strong>Setup:</strong> Paste your Google Apps Script Web App URL below, then click Connect.</p>
  <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/YOUR_ID/exec">
  <button class="btn-connect" onclick="connectScript()">Connect &rarr;</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="add">&#10133; Add Meeting</button>
  <button class="tab-btn" data-tab="schedule">&#128197; Full Schedule</button>
  <button class="tab-btn" data-tab="calendar">&#128467; Calendar</button>
  <button class="tab-btn" data-tab="team">&#128101; By Salesperson</button>
</div>

<div class="content">

  <!-- ADD MEETING -->
  <div class="tab-panel active" id="tab-add">
    <div class="add-form-wrap">
      <h2><div class="ico">&#128203;</div> Enter a New Meeting</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Your Name <span class="req">*</span></label>
          <select id="f-sp"><option value="">Select salesperson...</option></select>
        </div>
        <div class="form-group">
          <label>Type <span class="req">*</span></label>
          <select id="f-type">
            <option value="">Select type...</option>
            <option value="lunch">&#129367; Lunch</option>
            <option value="dinner">&#127374; Dinner</option>
            <option value="meeting">&#128188; Meeting</option>
            <option value="breakfast">&#129360; Breakfast</option>
            <option value="reception">&#129346; Reception</option>
            <option value="other">&#128204; Other</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Co-op / Organization Name <span class="req">*</span></label>
        <input type="text" id="f-coop" placeholder="e.g. Tri-County Electric Cooperative">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Date <span class="req">*</span></label>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
var SALESPEOPLE = ["Mark","Steve","Matt","Rodney","Chris B","Michael","Other"];
var SP_COLORS   = ['sp-color-0','sp-color-1','sp-color-2','sp-color-3','sp-color-4','sp-color-5','sp-color-6'];
var DAYS = [
  {val:'2026-03-07',name:'Saturday',  short:'Mar 7' },
  {val:'2026-03-08',name:'Sunday',    short:'Mar 8' },
  {val:'2026-03-09',name:'Monday',    short:'Mar 9' },
  {val:'2026-03-10',name:'Tuesday',   short:'Mar 10'},
  {val:'2026-03-11',name:'Wednesday', short:'Mar 11'},
];
var TYPES = {lunch:'Lunch',dinner:'Dinner',meeting:'Meeting',breakfast:'Breakfast',reception:'Reception',other:'Other'};
var TYPE_ICONS = {lunch:'&#129367;',dinner:'&#127374;',meeting:'&#128188;',breakfast:'&#129360;',reception:'&#129346;',other:'&#128204;'};

var SCRIPT_URL = localStorage.getItem('pe2026_url') || '';
var meetings   = [];
var filters    = {sched:'all',team:'all'};
var addTags    = [];
var editTags   = [];
var editingId  = null;
var autoTimer  = null;

// ── INIT ──────────────────────────────────────────────────────────────────────
(function init() {
  var sp = document.getElementById('f-sp');
  SALESPEOPLE.forEach(function(n){ var o=document.createElement('option'); o.value=n; o.textContent=n; sp.appendChild(o); });
  wireTagInput('tagInput','tagsWrap',addTags,renderAddTags);
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
      document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
      renderSchedule(); renderTeam(); renderCalendar();
    });
  });
  if (SCRIPT_URL) {
    document.getElementById('scriptUrlInput').value = SCRIPT_URL;
    document.getElementById('configBanner').style.display='none';
    loadMeetings();
    autoTimer = setInterval(function(){loadMeetings(false);}, 30000);
  } else {
    setSyncStatus('err','Not connected');
    renderSchedule(); renderTeam(); renderCalendar();
  }
})();

// ── CONNECTION ────────────────────────────────────────────────────────────────
function connectScript() {
  var url = document.getElementById('scriptUrlInput').value.trim();
  if (!url || url.indexOf('script.google.com') < 0) { toast('Please paste a valid Apps Script URL.','err'); return; }
  SCRIPT_URL = url;
  localStorage.setItem('pe2026_url', SCRIPT_URL);
  document.getElementById('configBanner').style.display='none';
  loadMeetings();
  clearInterval(autoTimer);
  autoTimer = setInterval(function(){loadMeetings(false);}, 30000);
}

// ── API (JSONP) ───────────────────────────────────────────────────────────────
function api(params) {
  return new Promise(function(resolve,reject){
    if (!SCRIPT_URL) { reject(new Error('No script URL')); return; }
    var cbName = 'gscb_' + Date.now() + '_' + Math.floor(Math.random()*9999);
    var timer = setTimeout(function(){
      cleanup(); reject(new Error('Request timed out'));
    }, 15000);
    function cleanup(){
      clearTimeout(timer); delete window[cbName];
      var s=document.getElementById(cbName); if(s) s.remove();
    }
    window[cbName] = function(json){
      cleanup();
      if (json && json.error) reject(new Error(json.error));
      else resolve(json);
    };
    var p = Object.assign({}, params, {callback: cbName});
    var qs = Object.keys(p).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(p[k]); }).join('&');
    var script = document.createElement('script');
    script.id = cbName; script.src = SCRIPT_URL+'?'+qs;
    script.onerror = function(){ cleanup(); reject(new Error('Network error — check Script URL')); };
    document.head.appendChild(script);
  });
}

// ── LOAD ──────────────────────────────────────────────────────────────────────
function loadMeetings(showFeedback) {
  if (!SCRIPT_URL) return;
  setSyncStatus('loading','Syncing...');
  if (showFeedback) document.getElementById('schedRefresh').classList.add('spinning');
  api({action:'getAll'}).then(function(result){
    meetings = result.meetings || result.data || [];
    setSyncStatus('ok','Synced · '+meetings.length+' event'+(meetings.length!==1?'s':''));
    renderSchedule(); renderTeam(); renderCalendar();
    if (showFeedback) toast('Refreshed!','ok');
  }).catch(function(e){
    console.error('Load error:',e);
    setSyncStatus('err','Sync failed: '+e.message);
    if (showFeedback) toast('Error: '+e.message,'err');
  }).finally(function(){
    document.getElementById('schedRefresh').classList.remove('spinning');
  });
}

function setSyncStatus(state,text){
  var el=document.getElementById('syncStatus');
  el.className='sync-status '+state;
  document.getElementById('syncText').textContent=text;
}

// ── TAG HELPERS ───────────────────────────────────────────────────────────────
function wireTagInput(inputId,wrapId,arr,onChange){
  var inp=document.getElementById(inputId);
  if(!inp) return;
  inp.addEventListener('keydown',function(e){
    if ((e.key==='Enter'||e.key===',') && inp.value.trim()){
      e.preventDefault();
      var val=inp.value.replace(/,/g,'').trim();
      if(val && arr.indexOf(val)<0) arr.push(val);
      inp.value=''; onChange();
    } else if(e.key==='Backspace' && !inp.value && arr.length){
      arr.pop(); onChange();
    }
  });
  inp.addEventListener('blur',function(){
    var val=inp.value.replace(/,/g,'').trim();
    if(val && arr.indexOf(val)<0){ arr.push(val); inp.value=''; onChange(); }
  });
}

function renderTagsInto(arr,wrapId,inputId,removeFn){
  var wrap=document.getElementById(wrapId), inp=document.getElementById(inputId);
  if(!wrap||!inp) return;
  wrap.querySelectorAll('.tag').forEach(function(t){t.remove();});
  arr.forEach(function(t,i){
    var el=document.createElement('span'); el.className='tag';
    el.innerHTML=esc(t)+'<button class="tag-rm" onclick="'+removeFn+'('+i+')">&#215;</button>';
    wrap.insertBefore(el,inp);
  });
}
function removeAddTag(i){ addTags.splice(i,1); renderAddTags(); }
function renderAddTags(){ renderTagsInto(addTags,'tagsWrap','tagInput','removeAddTag'); }
function removeEditTag(i){ editTags.splice(i,1); renderEditTags(); }
function renderEditTags(){ renderTagsInto(editTags,'eTagsWrap','eTagInput','removeEditTag'); }

// ── SUBMIT ────────────────────────────────────────────────────────────────────
function submitMeeting(){
  if(!SCRIPT_URL){ toast('Connect to Google Sheets first.','err'); return; }
  var sp=v('f-sp'),type=v('f-type'),coop=v('f-coop').trim();
  var date=v('f-date'),time=v('f-time'),venue=v('f-venue').trim();
  var seats=v('f-seats'),notes=v('f-notes').trim();
  if(!sp||!type||!coop||!date||!time||!venue){ toast('Please fill in all required fields.','err'); return; }
  if(!addTags.length){ toast('Please add at least one attendee.','err'); return; }
  var btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='Saving...';
  api({action:'add',sp:sp,type:type,coop:coop,date:date,time:time,venue:venue,seats:seats,notes:notes,attendees:JSON.stringify(addTags)})
  .then(function(){
    ['f-sp','f-type','f-coop','f-date','f-time','f-venue','f-seats','f-notes'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
    addTags.length=0; renderAddTags();
    toast('Meeting saved! ✓','ok');
    loadMeetings();
  }).catch(function(e){
    console.error('Save error:',e);
    toast('Save error: '+e.message,'err');
  }).finally(function(){
    btn.disabled=false; btn.textContent='Save Meeting →';
  });
}
function v(id){ return (document.getElementById(id)||{}).value||''; }

// ── FILTERS ───────────────────────────────────────────────────────────────────
function setFilter(btn,view){
  btn.closest('.filter-bar').querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filters[view]=btn.dataset.type;
  if(view==='sched') renderSchedule(); else renderTeam();
}
function filtered(view){
  var q=(document.getElementById(view==='sched'?'schedSearch':'teamSearch')||{}).value||'';
  q=q.toLowerCase();
  return meetings.filter(function(m){
    return (filters[view]==='all'||m.type===filters[view]) &&
           (!q||m.coop.toLowerCase().indexOf(q)>=0||m.venue.toLowerCase().indexOf(q)>=0||m.sp.toLowerCase().indexOf(q)>=0);
  });
}

// ── CARD HTML ─────────────────────────────────────────────────────────────────
function spColor(name){ var i=SALESPEOPLE.indexOf(name); return i>=0?SP_COLORS[i]:'sp-color-0'; }
function spInitials(name){ return (name||'').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase(); }
function fmtTime(t){
  if(!t) return '';
  var parts=t.split(':'), hh=parseInt(parts[0]), mm=parts[1];
  return (hh>12?hh-12:(hh||12))+':'+mm+' '+(hh>=12?'PM':'AM');
}
function cardHTML(m){
  var ic=TYPE_ICONS[m.type]||'&#128204;', col=spColor(m.sp);
  var atts=Array.isArray(m.attendees)?m.attendees:(m.attendees?[m.attendees]:[]);
  return '<div class="meeting-card t-'+m.type+'" onclick="openEdit(\''+m.id+'\')" title="Click to edit">'
    +'<div class="card-top"><span class="type-pill">'+ic+' '+(TYPES[m.type]||m.type)+'</span><span class="time-tag">'+fmtTime(m.time)+'</span></div>'
    +'<div class="card-coop">'+esc(m.coop)+'</div>'
    +'<div class="card-meta">'
    +'<div class="card-meta-row"><span>&#128205;</span><strong>'+esc(m.venue)+'</strong></div>'
    +(m.seats?'<div class="card-meta-row"><span>&#129681;</span><strong>'+m.seats+'</strong> seats reserved</div>':'')
    +(m.notes?'<div class="card-meta-row"><span>&#128221;</span>'+esc(m.notes.slice(0,70))+(m.notes.length>70?'...':'')+'</div>':'')
    +'</div>'
    +(atts.length?'<div class="card-attendees">'+atts.map(function(a){return '<span class="att-chip">'+esc(a)+'</span>';}).join('')+'</div>':'')
    +'<div class="card-footer">'
    +'<div style="display:flex;align-items:center;"><span class="sp-avatar '+col+'">'+spInitials(m.sp)+'</span><span style="font-size:.78rem;font-weight:600;color:rgba(255,255,255,.75);">'+esc(m.sp)+'</span></div>'
    +'<div style="display:flex;align-items:center;gap:5px;">'
    +(m.seats?'<span class="seats-badge">&#129681; '+m.seats+'</span>':'')
    +'<button class="btn-del" onclick="event.stopPropagation();deleteMeeting(\''+m.id+'\')" title="Delete">&#128465;</button>'
    +'</div></div>'
    +'</div>';
}

// ── RENDER SCHEDULE ───────────────────────────────────────────────────────────
function renderSchedule(){
  var fm=filtered('sched');
  var totalSeats=meetings.reduce(function(s,m){return s+(parseInt(m.seats)||0);},0);
  document.getElementById('schedStats').innerHTML=
    '<div class="stat-chip"><span class="num">'+meetings.length+'</span><span class="lbl">Total Events</span></div>'
    +'<div class="stat-chip"><span class="num">'+new Set(meetings.map(function(m){return m.coop;})).size+'</span><span class="lbl">Co-ops</span></div>'
    +'<div class="stat-chip"><span class="num">'+(totalSeats||'&mdash;')+'</span><span class="lbl">Seats Reserved</span></div>'
    +'<div class="stat-chip"><span class="num">'+meetings.filter(function(m){return m.type==='dinner';}).length+'</span><span class="lbl">Dinners</span></div>'
    +'<div class="stat-chip"><span class="num">'+meetings.filter(function(m){return m.type==='lunch';}).length+'</span><span class="lbl">Lunches</span></div>'
    +'<div class="stat-chip"><span class="num">'+meetings.filter(function(m){return m.type==='meeting';}).length+'</span><span class="lbl">Meetings</span></div>';
  var body=document.getElementById('schedBody');
  if(!meetings.length){ body.innerHTML='<div class="empty-state"><div class="ei">&#128219;</div><p>'+(SCRIPT_URL?'No meetings yet &mdash; use Add Meeting to get started!':'Connect to Google Sheets using the banner above.')+'</p></div>'; return; }
  if(!fm.length){ body.innerHTML='<div class="empty-state"><div class="ei">&#128269;</div><p>No events match your filter.</p></div>'; return; }
  var html='';
  DAYS.forEach(function(day){
    var dm=fm.filter(function(m){return m.date===day.val;}).sort(function(a,b){return a.time.localeCompare(b.time);});
    if(!dm.length) return;
    html+='<div class="day-section"><div class="day-header"><span class="day-name">'+day.name+'</span><span class="day-date">'+day.short+'</span><span class="day-count">'+dm.length+' event'+(dm.length!==1?'s':'')+'</span></div><div class="cards-grid">'+dm.map(cardHTML).join('')+'</div></div>';
  });
  body.innerHTML=html||'<div class="empty-state"><div class="ei">&#128269;</div><p>No events match your filter.</p></div>';
}

// ── RENDER TEAM ───────────────────────────────────────────────────────────────
function renderTeam(){
  var fm=filtered('team');
  var totalSeats=meetings.reduce(function(s,m){return s+(parseInt(m.seats)||0);},0);
  document.getElementById('teamStats').innerHTML=
    '<div class="stat-chip"><span class="num">'+meetings.length+'</span><span class="lbl">Total Events</span></div>'
    +'<div class="stat-chip"><span class="num">'+SALESPEOPLE.length+'</span><span class="lbl">Sales Team</span></div>'
    +'<div class="stat-chip"><span class="num">'+(totalSeats||'&mdash;')+'</span><span class="lbl">Seats Reserved</span></div>'
    +'<div class="stat-chip"><span class="num">'+new Set(meetings.map(function(m){return m.coop;})).size+'</span><span class="lbl">Co-ops</span></div>';
  var html='';
  SALESPEOPLE.forEach(function(name,idx){
    var col=SP_COLORS[idx], ini=spInitials(name);
    var allFor=meetings.filter(function(m){return m.sp===name;});
    var pf=fm.filter(function(m){return m.sp===name;}).sort(function(a,b){return a.date.localeCompare(b.date)||a.time.localeCompare(b.time);});
    var tc={};
    allFor.forEach(function(m){tc[m.type]=(tc[m.type]||0)+1;});
    var summary=Object.keys(tc).map(function(t){return tc[t]+' '+t+(tc[t]!==1?'s':'');}).join(' &middot; ')||'No events yet';
    var cardsHtml='';
    DAYS.forEach(function(day){
      var dm=pf.filter(function(m){return m.date===day.val;});
      if(!dm.length) return;
      cardsHtml+='<div style="grid-column:1/-1;font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--slate);margin-top:4px;margin-bottom:2px;">'+day.name+', '+day.short+'</div>';
      cardsHtml+=dm.map(cardHTML).join('');
    });
    if(!cardsHtml && allFor.length) cardsHtml='<div style="grid-column:1/-1;color:var(--slate);font-size:.82rem;padding:4px;">No events match current filter.</div>';
    if(!cardsHtml) cardsHtml='<div style="grid-column:1/-1;color:var(--slate);font-size:.82rem;padding:4px;">No events scheduled yet.</div>';
    html+='<div class="person-section">'
      +'<div class="person-header '+(allFor.length?'expanded':'')+'" onclick="togglePerson(this)">'
      +'<div class="person-avatar-lg '+col+'">'+ini+'</div>'
      +'<div class="person-info"><div class="pname">'+esc(name)+'</div><div class="pcounts">'+allFor.length+' event'+(allFor.length!==1?'s':'')+' &nbsp;&middot;&nbsp; '+summary+'</div></div>'
      +'<div class="person-expand">&#9660;</div>'
      +'</div>'
      +'<div class="person-cards '+(allFor.length?'open':'')+'">'+cardsHtml+'</div>'
      +'</div>';
  });
  document.getElementById('teamBody').innerHTML=html;
}
function togglePerson(h){ h.classList.toggle('expanded'); h.nextElementSibling.classList.toggle('open'); }

// ── CALENDAR VIEW ─────────────────────────────────────────────────────────────
function renderCalendar(){
  var body=document.getElementById('calBody');
  if(!body) return;
  var START_HOUR=6, END_HOUR=22, HOUR_H=56;
  var TYPE_CLS={lunch:'ce-lunch',dinner:'ce-dinner',meeting:'ce-meeting',breakfast:'ce-breakfast',reception:'ce-reception',other:'ce-other'};
  var LEGEND=[{cls:'ce-lunch',l:'Lunch'},{cls:'ce-dinner',l:'Dinner'},{cls:'ce-meeting',l:'Meeting'},{cls:'ce-breakfast',l:'Breakfast'},{cls:'ce-reception',l:'Reception'},{cls:'ce-other',l:'Other'}];

  var legendHtml=LEGEND.map(function(li){ return '<div class="cal-legend-item"><div class="cal-legend-dot '+li.cls+'"></div>'+li.l+'</div>'; }).join('');

  var html='<div style="padding:28px 36px;">'
    +'<div class="cal-toolbar"><div class="cal-title">Week of March 7&ndash;11, 2026</div>'
    +'<button class="btn-refresh" onclick="loadMeetings(true)"><span class="ri">&#8635;</span> Refresh</button></div>'
    +'<div class="cal-legend">'+legendHtml+'</div>'
    +'<div class="cal-grid">';

  // Header row
  html+='<div class="cal-hdr" style="background:rgba(255,255,255,.03);"></div>';
  DAYS.forEach(function(day){
    var cnt=meetings.filter(function(m){return m.date===day.val;}).length;
    html+='<div class="cal-hdr"><div class="ch-day">'+day.name+'</div><div class="ch-date">'+day.short+(cnt?' &middot; <span style="color:var(--gold)">'+cnt+'</span>':'')+'</div></div>';
  });

  // Time column
  html+='<div class="cal-time-col">';
  for(var h=START_HOUR;h<=END_HOUR;h++){
    var lbl=h===12?'12 PM':h<12?h+' AM':(h-12)+' PM';
    html+='<div class="cal-time-slot">'+lbl+'</div>';
  }
  html+='</div>';

  // Day columns
  DAYS.forEach(function(day){
    var dayMs=meetings.filter(function(m){return m.date===day.val;});
    html+='<div class="cal-day-col">';
    for(var hh=START_HOUR;hh<=END_HOUR;hh++) html+='<div class="cal-hour-line"></div>';

    // Overlap detection
    var sorted=dayMs.slice().sort(function(a,b){return a.time.localeCompare(b.time);});
    var lanes=[];
    sorted.forEach(function(m){
      var parts=m.time.split(':'), hh2=parseInt(parts[0]), mm2=parseInt(parts[1]);
      var startMin=hh2*60+mm2-START_HOUR*60;
      var endMin=startMin+55;
      var lane=0;
      while(lanes[lane]!==undefined && lanes[lane]>startMin) lane++;
      lanes[lane]=endMin;
      m._lane=lane; m._startMin=startMin;
    });
    var maxLane=sorted.length?Math.max.apply(null,sorted.map(function(m){return m._lane;})):0;

    sorted.forEach(function(m){
      var parts=m.time.split(':'), hh2=parseInt(parts[0]), mm2=parseInt(parts[1]);
      if(hh2<START_HOUR||hh2>END_HOUR) return;
      var startMin=hh2*60+mm2-START_HOUR*60;
      var top=startMin*HOUR_H/60;
      var height=Math.max(42,HOUR_H-4);
      var laneW=maxLane>0?1/(maxLane+1):1;
      var leftPct=m._lane*laneW*100;
      var widthPct=laneW*100;
      var cls=TYPE_CLS[m.type]||'ce-other';
      var atts=Array.isArray(m.attendees)?m.attendees:(m.attendees?[m.attendees]:[]);
      var attStr=atts.slice(0,2).join(', ')+(atts.length>2?'...':'');
      var coopShort=m.coop.length>20?m.coop.slice(0,18)+'...':m.coop;
      html+='<div class="cal-event '+cls+'" '
        +'style="top:'+top+'px;height:'+height+'px;left:calc('+leftPct+'% + 2px);width:calc('+widthPct+'% - 4px);" '
        +'onclick="openEdit(\''+m.id+'\')" '
        +'title="'+esc(m.coop)+' &middot; '+fmtTime(m.time)+' &middot; '+esc(m.venue)+'">'
        +'<div class="ce-time">'+fmtTime(m.time)+'</div>'
        +'<div class="ce-coop">'+esc(coopShort)+'</div>'
        +'<div class="ce-sp">'+esc(m.sp)+(attStr?' &middot; '+esc(attStr):'')+'</div>'
        +'</div>';
    });
    html+='</div>';
  });

  html+='</div></div>'; // end cal-grid + padding wrapper
  body.innerHTML=html;
}

// ── DELETE ────────────────────────────────────────────────────────────────────
function deleteMeeting(id){
  if(!confirm('Delete this meeting? This cannot be undone.')) return;
  api({action:'delete',id:id}).then(function(){
    meetings=meetings.filter(function(m){return m.id!==id;});
    renderSchedule(); renderTeam(); renderCalendar();
    toast('Meeting deleted.','ok');
  }).catch(function(e){
    console.error('Delete error:',e);
    toast('Delete error: '+e.message,'err');
  });
}

// ── EDIT MODAL ────────────────────────────────────────────────────────────────
function openEdit(id){
  var m=meetings.find(function(x){return x.id===id;}); if(!m) return;
  editingId=id;
  editTags=Array.isArray(m.attendees)?m.attendees.slice():(m.attendees?[m.attendees]:[]);
  var spOpts=SALESPEOPLE.map(function(n){return '<option value="'+n+'"'+(m.sp===n?' selected':'')+'>'+n+'</option>';}).join('');
  var dayOpts=DAYS.map(function(d){return '<option value="'+d.val+'"'+(m.date===d.val?' selected':'')+'>'+d.name+', '+d.short+'</option>';}).join('');
  var typeOpts=Object.keys(TYPES).map(function(t){return '<option value="'+t+'"'+(m.type===t?' selected':'')+'>'+TYPE_ICONS[t]+' '+TYPES[t]+'</option>';}).join('');
  document.getElementById('modalForm').innerHTML=
    '<div class="form-row" style="margin-bottom:16px;">'
    +'<div class="form-group" style="margin:0;"><label>Salesperson</label><select id="e-sp">'+spOpts+'</select></div>'
    +'<div class="form-group" style="margin:0;"><label>Type</label><select id="e-type">'+typeOpts+'</select></div>'
    +'</div>'
    +'<div class="form-group"><label>Co-op Name</label><input type="text" id="e-coop" value="'+esc(m.coop)+'"></div>'
    +'<div class="form-row" style="margin-bottom:16px;">'
    +'<div class="form-group" style="margin:0;"><label>Date</label><select id="e-date">'+dayOpts+'</select></div>'
    +'<div class="form-group" style="margin:0;"><label>Time</label><input type="time" id="e-time" value="'+m.time+'"></div>'
    +'</div>'
    +'<div class="form-row" style="margin-bottom:16px;">'
    +'<div class="form-group" style="margin:0;"><label>Venue</label><input type="text" id="e-venue" value="'+esc(m.venue)+'"></div>'
    +'<div class="form-group" style="margin:0;"><label>Seats</label><input type="number" id="e-seats" value="'+m.seats+'" min="1"></div>'
    +'</div>'
    +'<div class="form-group"><label>Attendees</label>'
    +'<div class="tags-wrap" id="eTagsWrap" onclick="document.getElementById(\'eTagInput\').focus()">'
    +'<input class="tag-inp" id="eTagInput" placeholder="Add name, press Enter...">'
    +'</div></div>'
    +'<div class="form-group"><label>Notes</label><textarea id="e-notes">'+esc(m.notes||'')+'</textarea></div>';
  renderEditTags();
  wireTagInput('eTagInput','eTagsWrap',editTags,renderEditTags);
  document.getElementById('editModal').classList.add('open');
}

function saveEdit(){
  var i=meetings.findIndex(function(x){return x.id===editingId;}); if(i<0) return;
  var btn=document.getElementById('saveBtn');
  btn.disabled=true; btn.textContent='Saving...';
  var updated=Object.assign({},meetings[i],{
    sp:v('e-sp'),type:v('e-type'),coop:v('e-coop').trim(),
    date:v('e-date'),time:v('e-time'),venue:v('e-venue').trim(),
    seats:v('e-seats'),notes:v('e-notes').trim(),attendees:editTags.slice()
  });
  api({action:'update',id:editingId,sp:updated.sp,type:updated.type,coop:updated.coop,
    date:updated.date,time:updated.time,venue:updated.venue,seats:updated.seats,
    notes:updated.notes,attendees:JSON.stringify(updated.attendees)})
  .then(function(){
    meetings[i]=updated;
    closeModal(); renderSchedule(); renderTeam(); renderCalendar();
    toast('Meeting updated! ✓','ok');
  }).catch(function(e){
    console.error('Update error:',e);
    toast('Update error: '+e.message,'err');
  }).finally(function(){
    btn.disabled=false; btn.textContent='Save Changes';
  });
}
function closeModal(){ document.getElementById('editModal').classList.remove('open'); editingId=null; }

// ── PRINT ─────────────────────────────────────────────────────────────────────
function printSchedule(){
  var ts=new Date().toLocaleString('en-US',{month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
  var TCOL={lunch:'#2d7a5a',dinner:'#a05c10',meeting:'#2a4fa0',breakfast:'#8a7800',reception:'#7a30a0',other:'#555'};
  var rows='';
  DAYS.forEach(function(day){
    var dm=meetings.filter(function(m){return m.date===day.val;}).sort(function(a,b){return a.time.localeCompare(b.time);});
    if(!dm.length) return;
    rows+='<tr><td colspan="7" style="background:#e8eef5;font-weight:700;font-size:11pt;padding:9px 12px;border-top:2px solid #1a3060;">'+day.name+', '+day.short+'</td></tr>';
    dm.forEach(function(m){
      var atts=Array.isArray(m.attendees)?m.attendees.join(', '):(m.attendees||'');
      var col=TCOL[m.type]||'#555';
      rows+='<tr>'
        +'<td style="padding:7px 10px;border-bottom:1px solid #ddd;white-space:nowrap;">'+fmtTime(m.time)+'</td>'
        +'<td style="padding:7px 10px;border-bottom:1px solid #ddd;"><span style="background:'+col+';color:#fff;padding:2px 8px;border-radius:4px;font-size:8.5pt;font-weight:600;">'+(TYPES[m.type]||m.type)+'</span></td>'
        +'<td style="padding:7px 10px;border-bottom:1px solid #ddd;font-weight:700;">'+esc(m.coop)+'</td>'
        +'<td style="padding:7px 10px;border-bottom:1px solid #ddd;">'+esc(m.venue)+'</td>'
        +'<td style="padding:7px 10px;border-bottom:1px solid #ddd;text-align:center;">'+(m.seats||'-')+'</td>'
        +'<td style="padding:7px 10px;border-bottom:1px solid #ddd;">'+esc(atts)+'</td>'
        +'<td style="padding:7px 10px;border-bottom:1px solid #ddd;">'+esc(m.sp)+'</td>'
        +'</tr>';
    });
  });
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>PowerExchange 2026 - Schedule</title>'
    +'<style>body{font-family:Arial,sans-serif;font-size:10pt;color:#111;margin:24px;}'
    +'h1{font-size:15pt;color:#0c1f3f;margin-bottom:4px;}p.sub{color:#555;font-size:9pt;margin-bottom:14px;}'
    +'table{width:100%;border-collapse:collapse;}th{background:#0c1f3f;color:#fff;padding:8px 10px;text-align:left;font-size:9pt;}'
    +'tr:nth-child(even) td{background:#f7f7f7;}@media print{.no-print{display:none;}}</style>'
    +'</head><body>'
    +'<h1>PowerExchange 2026 - Team Meeting Schedule</h1>'
    +'<p class="sub">NRECA TechAdvantage - March 7-11, 2026 - Orlando, FL - Printed '+ts+' - '+meetings.length+' total events</p>'
    +'<button class="no-print" onclick="window.print()" style="margin-bottom:14px;padding:8px 20px;background:#e8b84b;color:#0c1f3f;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:10pt;">Print / Save as PDF</button>'
    +'<table><thead><tr><th>Time</th><th>Type</th><th>Co-op</th><th>Venue</th><th>Seats</th><th>Attendees</th><th>Sales Rep</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></body></html>';
  var w=window.open('','_blank','width=1050,height=720');
  if(!w){ alert('Please allow popups for this page, then try again.'); return; }
  w.document.write(html);
  w.document.close();
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function toast(msg,type){
  var t=document.createElement('div');
  t.className='toast '+(type||'ok'); t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){t.remove();},3500);
}
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
